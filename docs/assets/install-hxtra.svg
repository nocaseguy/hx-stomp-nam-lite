<svg xmlns="http://www.w3.org/2000/svg" width="640" height="100" viewBox="0 0 640 100" role="img" aria-label="Install HXtra">
  <style>
    .sheen{animation:sheen 4s ease-in-out infinite}
    .arrow{animation:nudge 2s ease-in-out infinite}
    @keyframes sheen{0%{transform:translateX(-260px)}45%,100%{transform:translateX(760px)}}
    @keyframes nudge{0%,50%,100%{transform:translateX(0)}25%{transform:translateX(9px)}}
    @media (prefers-reduced-motion:reduce){.sheen,.arrow{animation:none}.sheen{display:none}}
  </style>
  <defs>
    <clipPath id="btn"><rect x="2" y="2" width="636" height="96" rx="16"/></clipPath>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="636" height="96" rx="16" fill="#000"/>
  <g clip-path="url(#btn)"><rect class="sheen" x="0" y="-20" width="160" height="140" fill="url(#shine)"/></g>
  <rect x="2" y="2" width="636" height="96" rx="16" fill="none" stroke="#3d444d" stroke-width="2"/>
  <text x="294" y="63" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#fff" letter-spacing="-.5">Install HXtra</text>
  <path class="arrow" d="M440 50h34M460 36l14 14-14 14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
