<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="HXtra: custom firmware for the Line 6 HX Stomp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ff3d9a" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#3d7bff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset="0.5" stop-color="#ff2e93"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <!-- Rainbow: full-saturation hues once across the line, flowing left one line-length a cycle -->
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="990" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.1667" stop-color="#ffff00"/>
      <stop offset="0.3333" stop-color="#00ff00"/>
      <stop offset="0.5" stop-color="#00ffff"/>
      <stop offset="0.6667" stop-color="#0000ff"/>
      <stop offset="0.8333" stop-color="#ff00ff"/>
      <stop offset="1" stop-color="#ff0000"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-700 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <text x="640" y="200" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-4">
      <tspan fill="#ffffff">HX</tspan><tspan fill="url(#tra)">tra</tspan>
    </text>

    <!-- The breathing line at its defaults, Rainbow, Breathe, Speed 4: src/m4/breathing_line.s's curve sampled over its 4 s cycle -->
    <rect x="290" y="242" width="700" height="10" rx="5" fill="url(#rainbow)" filter="url(#blur)" opacity="0.14">
      <animate attributeName="opacity" values="0.138;0.141;0.141;0.141;0.144;0.147;0.157;0.170;0.188;0.215;0.246;0.281;0.319;0.362;0.401;0.438;0.471;0.500;0.519;0.534;0.542;0.547;0.548;0.548;0.548;0.548;0.548;0.547;0.542;0.534;0.519;0.500;0.471;0.438;0.401;0.362;0.319;0.281;0.246;0.215;0.188;0.170;0.157;0.147;0.144;0.141;0.141;0.141;0.138" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="244" width="700" height="6" rx="3" fill="url(#rainbow)"/>
    <rect x="290" y="244" width="700" height="6" rx="3" fill="#000" opacity="0.75">
      <animate attributeName="opacity" values="0.750;0.744;0.744;0.744;0.738;0.732;0.715;0.691;0.659;0.609;0.553;0.488;0.421;0.341;0.271;0.203;0.144;0.091;0.056;0.029;0.015;0.006;0.003;0.003;0.003;0.003;0.003;0.006;0.015;0.029;0.056;0.091;0.144;0.203;0.271;0.341;0.421;0.488;0.553;0.609;0.659;0.691;0.715;0.732;0.738;0.744;0.744;0.744;0.750" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="640" y="310" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#c9d1d9">Custom firmware for the Line 6 HX Stomp</text>
  </g>
</svg>
