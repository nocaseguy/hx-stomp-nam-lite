name: pages

# Publishes the setup page (web/) for a release, with the files the in-browser build reads (build.py, tools/, src/m4/,
# src/sharc/: tests/test_web_build.py checks they cover web/firmware-worker.js's SOURCES) in the repository's own layout, and the release's m4cache.json (tools/release.py attaches it) at the root: the page is at /web/.
# A release publishes it; a manual run can take the page from another ref, keeping the release's m4cache.json.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish again
        required: true
      ref:
        description: Where to take the page and build files from, when only the page changed since the release (default, the release)
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}web/
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}
      - name: site
        run: |
          mkdir -p _site/src
          cp -r web tools build.py LICENSE NOTICE _site/
          cp -r src/m4 src/sharc _site/src/
          find _site -name __pycache__ -prune -exec rm -rf {} +
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p m4cache.json -D _site
          printf '<!doctype html><meta charset="utf-8"><script>location.replace("web/" + location.hash)</script><meta http-equiv="refresh" content="0; url=web/"><title>HXtra Setup</title><a href="web/">HXtra Setup</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
